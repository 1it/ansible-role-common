---
# Package upgrades
do_upgrade: false
apt_upgrade_type: safe
apt_cache_valid_time: 3600

# APT sources management (opt-in so cloud/regional mirrors are not overwritten by default)
manage_apt_sources: false
apt_debian_mirror: "https://deb.debian.org/debian"
apt_debian_security_mirror: "https://deb.debian.org/debian-security"
# Leave empty to auto-select archive/security.ubuntu.com (x86_64/i386) or ports.ubuntu.com (arm64/arm)
apt_ubuntu_mirror: ""
apt_ubuntu_security_mirror: ""
apt_include_deb_src: false

# Timezone & NTP
manage_timezone: true
timezone: "UTC"
manage_ntp: true

# Journald log retention limits (prevents high-traffic logs from filling /)
manage_journald: true
journald_config:
  SystemMaxUse: "1G"
  SystemKeepFree: "2G"
  MaxRetentionSec: "1month"
  Compress: "yes"

# Locales
locales:
  - en_US.UTF-8
default_locale: "en_US.UTF-8"
yum_locale_packages:
  - glibc-langpack-en

# System limits (PAM limits.d + systemd DefaultLimitNOFILE for services)
system_limits:
  ulimits:
    - "root soft nofile 65536"
    - "root hard nofile 524288"
    - "* soft nofile 65536"
    - "* hard nofile 524288"

manage_systemd_limits: true
systemd_default_limit_nofile: "65536:524288"
systemd_default_limit_nproc: ""

# Kernel sysctl parameters (written to /etc/sysctl.d/ for Debian 13+ / modern systemd compatibility)
sysctl_file: "/etc/sysctl.d/99-common.conf"
sysctl_enable_bbr: true

sysctl_params:
  # Network listen/accept queues & burst handling
  - key: net.core.somaxconn
    value: 65535
  - key: net.core.netdev_max_backlog
    value: 16384
  - key: net.ipv4.tcp_max_syn_backlog
    value: 8192
  # Ephemeral port range & connection lifecycle for proxies / high-concurrency apps
  - key: net.ipv4.ip_local_port_range
    value: "10240 65535"
  - key: net.ipv4.tcp_fin_timeout
    value: 15
  - key: net.ipv4.tcp_tw_reuse
    value: 1
  - key: net.ipv4.tcp_slow_start_after_idle
    value: 0
  # Faster dead-peer detection than 2h default
  - key: net.ipv4.tcp_keepalive_time
    value: 600
  - key: net.ipv4.tcp_keepalive_intvl
    value: 30
  - key: net.ipv4.tcp_keepalive_probes
    value: 5
  # Basic TCP resilience
  - key: net.ipv4.tcp_syncookies
    value: 1
  # File watchers (containers, log shippers, web runtimes) & swap behavior
  - key: fs.inotify.max_user_watches
    value: 524288
  - key: fs.inotify.max_user_instances
    value: 1024
  - key: vm.swappiness
    value: 10

# Append or override individual sysctl_params entries without replacing defaults
sysctl_extra_params: []

# Base server packages (Debian/Ubuntu)
apt_packages:
  - bash-completion
  - bind9-dnsutils
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - iproute2
  - iputils-ping
  - jq
  - less
  - locales
  - lsof
  - netcat-openbsd
  - python3
  - rsync
  - strace
  - sysstat
  - tcpdump
  - tmux
  - traceroute
  - unzip
  - vim
  - zstd

apt_packages_extra: []

# Base server packages (RHEL / Rocky / Alma / CentOS)
yum_packages:
  - bash-completion
  - bind-utils
  - ca-certificates
  - curl
  - git
  - htop
  - iproute
  - iputils
  - jq
  - less
  - lsof
  - nmap-ncat
  - openssl
  - python3
  - rsync
  - strace
  - sysstat
  - tcpdump
  - tmux
  - traceroute
  - unzip
  - vim-enhanced
  - yum-utils
  - zstd

yum_packages_extra: []

# Custom APT repositories (DEB822 format via ansible.builtin.deb822_repository)
apt_repositories: []
#  - name: hashicorp
#    uris: https://apt.releases.hashicorp.com
#    suites: "{{ ansible_facts['distribution_release'] }}"
#    components:
#      - main
#    architectures: amd64
#    signed_by: https://apt.releases.hashicorp.com/gpg

# Legacy one-line APT repositories (written to /etc/apt/sources.list.d/*.list)
apt_repos_list: []
#  - repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com {{ ansible_facts['distribution_release'] }} main"
#    key: "https://apt.releases.hashicorp.com/gpg"
#    keyring: "/etc/apt/keyrings/hashicorp.asc"
#    filename: "hashicorp"

# YUM/DNF repositories
yum_enable_epel: true
yum_rpm_keys: []
yum_repos_list: []
yum_repositories: []
#  - name: example
#    description: Example Repository
#    baseurl: https://example.com/rpm/$releasever/$basearch
#    gpgcheck: true
#    gpgkey: https://example.com/RPM-GPG-KEY

# Root bash profile (opt-in to avoid overwriting distro defaults unexpectedly)
manage_root_profile: false
