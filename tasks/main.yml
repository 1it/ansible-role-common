---
- name: Setup APT repositories
  ansible.builtin.import_tasks: apt_repos.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - repos
    - apt_repos

- name: Setup YUM/DNF repositories
  ansible.builtin.import_tasks: yum_repos.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - repos
    - yum_repos

- name: Manage APT packages
  ansible.builtin.import_tasks: apt.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - apt
    - pkg

- name: Manage YUM/DNF packages
  ansible.builtin.import_tasks: yum.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - yum
    - dnf
    - pkg

- name: Configure timezone and NTP
  ansible.builtin.import_tasks: time.yml
  tags:
    - time
    - timezone
    - ntp

- name: Configure systemd-journald
  ansible.builtin.import_tasks: journald.yml
  tags:
    - journald
    - logging

- name: Configure system ulimits and systemd limits
  ansible.builtin.import_tasks: limits.yml
  tags:
    - ulimit
    - limits

- name: Configure sysctl parameters
  ansible.builtin.import_tasks: sysctl.yml
  tags:
    - sysctl

- name: Configure system locales
  ansible.builtin.import_tasks: locales.yml
  tags:
    - locales

- name: Configure root bash profile
  ansible.builtin.import_tasks: profile.yml
  tags:
    - profile
