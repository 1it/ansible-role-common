---
- name: Apt | Ensure prerequisites for repository management are installed
  ansible.builtin.apt:
    name: >-
      {{
        (['ca-certificates'] if (manage_apt_sources | bool or apt_repositories | length > 0 or apt_repos_list | length > 0) else [])
        + (['python3-debian'] if (apt_repositories | length > 0) else [])
      }}
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"
  register: _common_apt_repo_prereqs
  when: (manage_apt_sources | bool) or (apt_repositories | length > 0) or (apt_repos_list | length > 0)

- name: Apt | Update the sources list (/etc/apt/sources.list)
  ansible.builtin.template:
    src: "{{ ansible_facts['distribution'] }}.sources.list.j2"
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  when:
    - manage_apt_sources | bool
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  notify: Update apt cache

- name: Apt | Remove duplicate default DEB822 sources file when /etc/apt/sources.list is managed
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ ansible_facts['distribution'] | lower }}.sources"
    state: absent
  when:
    - manage_apt_sources | bool
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  notify: Update apt cache

- name: Apt | Remove legacy security.list when Debian sources are managed in /etc/apt/sources.list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/security.list
    state: absent
  when:
    - manage_apt_sources | bool
    - ansible_facts['distribution'] == 'Debian'
  notify: Update apt cache

# In check mode on a host without python3-debian (or ca-certificates for HTTPS
# signed_by keys), deb822_repository fails before making changes.
- name: Apt | Configure DEB822 APT repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: "{{ item.types | default(omit) }}"
    uris: "{{ item.uris | default(omit) }}"
    suites: "{{ item.suites | default(omit) }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    signed_by: "{{ item.signed_by | default(omit) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    trusted: "{{ item.trusted | default(omit) }}"
    mode: "{{ item.mode | default('0644') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ apt_repositories }}"
  when:
    - apt_repositories | length > 0
    - not (ansible_check_mode and _common_apt_repo_prereqs is changed)
  notify: Update apt cache

- name: Apt | Ensure APT keyring directories exist (legacy apt_repos_list)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: _common_apt_keyring_dirs
  loop: >-
    {{
      (['/etc/apt/keyrings'] + (
        apt_repos_list
        | selectattr('keyring', 'defined')
        | map(attribute='keyring')
        | map('dirname')
        | list
      )) | unique
    }}
  when: apt_repos_list | length > 0

- name: Apt | Download APT signing keys (legacy apt_repos_list)
  ansible.builtin.get_url:
    url: "{{ item.key }}"
    dest: >-
      {{
        item.keyring
        | default(
            '/etc/apt/trusted.gpg.d/'
            ~ (item.filename | default(item.key | regex_replace('^https?://', '') | regex_replace('[^a-zA-Z0-9_-]', '_')))
            ~ '.asc'
          )
      }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apt_repos_list }}"
  when:
    - item.key is defined
    - (item.state | default('present')) == 'present'
    - not (ansible_check_mode and (_common_apt_repo_prereqs is changed or _common_apt_keyring_dirs is changed))
  notify: Update apt cache

- name: Apt | Write legacy APT repository .list files
  ansible.builtin.copy:
    content: "{{ item.repo | trim }}\n"
    dest: >-
      /etc/apt/sources.list.d/{{
        (item.filename | regex_replace('\.list$', ''))
        if (item.filename is defined and item.filename | length > 0)
        else (
          item.repo
          | regex_replace('^deb(-src)?\s+(\[[^\]]*\]\s+)?https?://', '')
          | regex_replace('[^a-zA-Z0-9_-]+', '_')
          | regex_replace('^_+|_+$', '')
        )
      }}.list
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apt_repos_list }}"
  when: (item.state | default('present')) == 'present'
  notify: Update apt cache

- name: Apt | Remove legacy APT repository .list files
  ansible.builtin.file:
    path: >-
      /etc/apt/sources.list.d/{{
        (item.filename | regex_replace('\.list$', ''))
        if (item.filename is defined and item.filename | length > 0)
        else (
          item.repo
          | regex_replace('^deb(-src)?\s+(\[[^\]]*\]\s+)?https?://', '')
          | regex_replace('[^a-zA-Z0-9_-]+', '_')
          | regex_replace('^_+|_+$', '')
        )
      }}.list
    state: absent
  loop: "{{ apt_repos_list }}"
  when: (item.state | default('present')) == 'absent'
  notify: Update apt cache

- name: Apt | Flush handlers to update apt cache if repositories changed
  ansible.builtin.meta: flush_handlers
